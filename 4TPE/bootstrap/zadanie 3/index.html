    mt-mb-3 
    margin top - margin bottom - 3

    x - Lewa i prawa
    y - góra i dół
    0-5 + auto
    p-3
    mt-2
    mt-mid-3
    (odstep margin/padding)(kierunek)-(opcjonalnie rozmiar ekranu)
    (opcjonalnie rozmiar ekraunu)-(wartosc)
