<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<script
  src="https://code.jquery.com/jquery-4.0.0.min.js"
  integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao="
  crossorigin="anonymous">
</script>
<script>

$(function(){
$("#chowa").click(function() {
    $(this).hide();
});

$(document).keydown(function() {
    $("#chowa").show();
});

$("#chowa2").click(function(){
    $("#chowaPrzycisk").toggle();
});

$("#flip").click(function(){
    $("#panel").slideDown("slow");
  });
$("#flip2").click(function(){
    $("#panel2").slideUp("slow");
  });
$("#flip3").click(function(){
    $("#panel3").slideToggle("slow");
  });

})

</script>
<style> 
#panel, #flip,#panel2, #flip2,#panel3, #flip3 {
  padding: 5px;
  text-align: center;
  background-color: #e5eecc;
  border: solid 1px #c3c3c3;
}

#panel {
  padding: 50px;
  display: none;
}
#panel2 {
  padding: 50px;
}
#panel3 {
  padding: 50px;
  display: none;
}

</style>

</head>
<body>
    <p id="chowa">Pokazuje sie i chowam</p>
    <p id="chowaPrzycisk">Pokazuje sie i chowam inaczej</p>
    <button id="chowa2">Pokaz</button>

<div id="flip">Click to slide down panel</div>
<div id="panel">Hello world!</div>
<div id="flip2">Click to slide down panel</div>
<div id="panel2">Hello world!</div>
<div id="flip3">Click to slide down panel</div>
<div id="panel3">Hello world!</div>
</body>
</html>
